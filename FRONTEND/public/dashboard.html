<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen border-4 border-green-500">
    
    <div class="w-full max-w-4xl p-4">
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-4">
            <button class="text-2xl">&#9776;</button> <!-- Hamburger Menu -->
            <button class="text-2xl">&#9881;</button> <!-- Settings Icon -->
        </div>

        <!-- Content Section -->
        <div class="grid grid-cols-3 gap-4">
            <div class="col-span-2 space-y-4">
                <div class="bg-gray-300 h-16 w-full rounded"></div>
                <div class="bg-gray-300 h-10 w-2/3 rounded"></div>
                <div class="bg-gray-300 h-40 w-full rounded"></div>
            </div>

            <!-- History & Suggestions -->
            <div>
                <h3 class="font-semibold mb-2">History</h3>
                <div class="space-y-2">
                    <div class="bg-black h-2 w-full"></div>
                    <div class="bg-black h-2 w-3/4"></div>
                    <div class="bg-black h-2 w-2/3"></div>
                </div>

                <h3 class="font-semibold mt-4 mb-2">Suggestion</h3>
                <div class="space-y-2">
                    <div class="bg-black h-2 w-full"></div>
                    <div class="bg-black h-2 w-4/5"></div>
                    <div class="bg-black h-2 w-3/4"></div>
                    <div class="bg-black h-2 w-2/3"></div>
                    <div class="bg-black h-2 w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center bg-gray-300 rounded-full p-2 mt-6">
            <button class="px-3">🎤</button> <!-- Mic Icon -->
            <button class="px-3">🖊️</button> <!-- Text Input Icon -->
            <input type="text" placeholder="What you want to know" class="flex-grow bg-transparent outline-none px-3">
            <button class="px-3 text-blue-500">➤</button> <!-- Send Icon -->
        </div>
    </div>

</body>
</html>
