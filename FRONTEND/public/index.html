<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        #login-page { display: flex; justify-content: screen; align-items: screen; height: 100vh; }
        #root { display: none; } /* Hide React app initially */

        /* Custom Background Color for Right Side */
        .right-side {
            background-color: #f5f5f5; /* Change this to your desired color */
        }
    </style>
</head>
<body>
        <!-- Login Page -->
        <div class="flex w-screen h-screen bg-white" id="login-page">
            <!-- Left Side -->
            <div class="w-1/2 bg-gradient-to-r from-green-400 to-teal-500 p-8 flex flex-col justify-center items-center">
                <h2 class="text-3xl font-bold text-white mb-4">Hello, Friend...!</h2>
                <p class="text-white mb-8">Enter your personal details and start your journey with us</p>
                <a href="page-2.html">
                    <button type="button" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-full">Sign Up</button>
                </a>
            </div>
            <!-- Right Side (with custom background color and full width) -->
            <div class="flex-1 p-8 flex flex-col justify-center items-center right-side">
                <h2 class="text-2xl font-bold mb-4">Sign in to PAT</h2>
                <div class="flex space-x-2 mb-4">
                    <a href="#" class="text-gray-600"><i class="fas fa-phone fa-2x"></i></a>
                    <a href="#" class="text-gray-600"><i class="fas fa-envelope fa-2x"></i></a>
                    <a href="#" class="text-gray-600"><i class="fab fa-facebook fa-2x"></i></a>
                </div>
                
                <p class="text-gray-500 mb-4">Or use your email account</p>
                
                <input type="text" id="username" placeholder="Username" class="w-full mb-2 p-2 border border-gray-300 rounded">
                <input type="password" id="password" placeholder="Password" class="w-full mb-2 p-2 border border-gray-300 rounded">
                
                <p id="error-message" class="text-red-500 text-sm mb-2"></p>
                
                <a href="#" class="text-gray-500 mb-4">Forgot your password?</a>
                
                <button onclick="handleLogin()" class="bg-teal-400 text-white py-2 px-4 rounded-full">
                    Login
                </button>
            </div>
        </div>
    <!-- React App -->
    <div id="root"></div>

    <script>
        function validateLogin(username, password) {
            if (username.length < 3) {
                return "Username must be at least 3 characters.";
            }
            if (password.length < 6) {
                return "Password must be at least 6 characters.";
            }
            if (!/\d/.test(password)) {
                return "Password must contain at least one number.";
            }
            return ""; // No errors
        }

        function handleLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMessage = validateLogin(username, password);

            if (errorMessage) {
                document.getElementById("error-message").innerText = errorMessage;
                return;
            }

            // Hide login page
            document.getElementById("login-page").style.display = "none";
            // Show React app
            document.getElementById("root").style.display = "block";

            // Load React App
            const script = document.createElement("script");
            script.src = "static/js/bundle.js"; // React's built JS file
            script.onload = () => console.log("React App Loaded!");
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
